name: Build Opmize.app

# Opmize is cross-platform, but a .app can only be produced on macOS. This builds one on a
# GitHub runner so a Mac download exists without needing a Mac to hand.
#
# Push a tag to publish:   git tag v1.5 && git push origin v1.5
# Or run it by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14            # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow tifffile tkinterdnd2 pillow-heif pyinstaller

      - name: Check this Python has Tk
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build
        run: bash build_mac.sh
        env:
          PYTHON: python

      - name: Name the archive
        id: name
        run: echo "zip=$(ls *.zip | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Opmize-macos-arm64
          path: ${{ steps.name.outputs.zip }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.zip }}
